<style>
:root{--bg:rgba(8,12,16,.5);--bg2:rgba(8,12,16,.82);--line:rgba(255,255,255,.16);--ln2:#27323d;--tx:#e9eef2;--dim:#93a2ae;--grn:#3be08c;--mag:#ff62d6;--cyan:#56d9ff;--amb:#ffc54a;--red:#ff5252;
  --f:'B612',system-ui,sans-serif;--m:'B612 Mono',ui-monospace,Menlo,monospace;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --L:calc(8px + var(--sl));--R:calc(8px + var(--sr));--B:calc(8px + var(--sb));--T:calc(6px + var(--st));--lw:232px;--rw:156px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1117;color:var(--tx);font-family:var(--f);-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none}
#root{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;transform:translate(0,0)}   /* the (identity) transform makes #root the box every fixed-position child is placed in, so the whole game follows it when it is fitted to the visible part of a frame */
/* landscape lock: when the window is upright the whole game is drawn turned 90°, so it is landscape however the phone is held. Screen edges swap accordingly. */
html.rot{--sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-left,0px)}
html.rot #ov,html.rot #log,html.rot #gfx,html.rot #rlast{touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud>*{position:fixed;z-index:2}
button{font-family:var(--f);cursor:pointer}
.pnl{background:var(--bg);border:1px solid var(--line);border-radius:8px}
.btn{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:7px;font-weight:700;font-size:10px;line-height:1.15;letter-spacing:.06em;padding:0 2px;min-height:34px;touch-action:manipulation}
.btn small{display:block;font:700 8px var(--f);letter-spacing:.1em;opacity:.7}
.btn:active,.btn.on{background:rgba(59,224,140,.85);color:#06120b;border-color:var(--grn)}
.btn.pri{background:var(--cyan);color:#04141b;border-color:var(--cyan)}
/* PFD repeater (top-left): every number that used to sit in the stat bar lives here */
#pfdBox{left:var(--L);top:var(--T);width:var(--lw);border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000;line-height:0}
#pfd{display:block;width:100%;height:auto}
#chips{left:var(--L);top:calc(var(--T) + var(--lw)*.565 + 6px);display:flex;gap:5px;align-items:center;pointer-events:none}
#chips>div{display:none;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font:700 9px var(--f);letter-spacing:.1em;color:var(--dim);white-space:nowrap}
#warn{background:var(--red)!important;color:#fff!important;font:700 11px var(--m)!important;animation:bl .5s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}
#papi u{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:3px;vertical-align:-2px;background:#fff}#papi u.r{background:var(--red)}
#agl b{font:700 17px/1 var(--m);color:var(--cyan);letter-spacing:0;margin-right:4px}#agl.fl{border-color:var(--amb);color:var(--amb)}#agl.fl b{color:var(--amb)}
/* top-centre stack: radio first, coach under it. They share one column, so they can never sit on top of each other — and while the radio has a message for you the coach steps aside. */
#topc{left:calc(var(--L) + var(--lw) + 10px);right:calc(var(--R) + 112px);top:var(--T);display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:4!important}
#coach{padding:4px 8px;font-size:11.5px;line-height:1.28;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--mag);border-radius:6px}
body.ropen #coach,body.rmsg #coach{display:none!important}
#coach em{font-style:normal;color:var(--mag);font-weight:700;letter-spacing:.08em;margin-right:6px}
#map{right:var(--R);top:var(--T);width:104px;height:104px;background:#142118;border:1px solid rgba(255,255,255,.3);border-radius:8px;pointer-events:auto;touch-action:none;cursor:pointer}#map.full{border-radius:10px;box-shadow:0 0 0 2000px rgba(4,8,12,.55),0 8px 40px rgba(0,0,0,.6)}
/* flight controls hug the left and right edges */
#lctl{left:var(--L);bottom:var(--B);display:flex;align-items:flex-end;gap:6px}
#stick{width:124px;height:124px;border-radius:50%;background:var(--bg);border:1px solid var(--line);position:relative;touch-action:none;flex:none}
#stick:before,#stick:after{content:'';position:absolute;background:var(--line)}
#stick:before{left:50%;top:12px;bottom:12px;width:1px}#stick:after{top:50%;left:12px;right:12px;height:1px}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(226,233,238,.88);border:3px solid rgba(11,17,23,.8);box-shadow:0 2px 8px #0008;z-index:1}
#stick small{position:absolute;left:0;right:0;text-align:center;font:700 7.5px var(--f);letter-spacing:.1em;color:var(--dim)}#stick small.u{top:3px}#stick small.d{bottom:3px}
#lkeys{display:grid;grid-template-columns:48px 48px;gap:4px}#lkeys .btn{min-height:40px}
body.assist #bTd,body.assist #bTu{opacity:.25;pointer-events:none}
#rctl{right:var(--R);bottom:var(--B);display:flex;align-items:flex-end;gap:6px}
#rkeys{display:grid;grid-template-columns:42px 42px;gap:4px;width:88px}#rkeys .w2{grid-column:span 2}#bBrk{min-height:50px;font-size:11px}
#thr{--p:0;width:56px;height:150px;background:var(--bg);border:1px solid var(--line);border-radius:9px;flex:none;overflow:hidden;display:flex;flex-direction:column}
#thr b{flex:none;text-align:center;font:700 8px/1 var(--f);letter-spacing:.1em;color:var(--dim);padding-top:6px}
#thr i{flex:none;text-align:center;font:700 14px/1 var(--m);font-style:normal;color:#fff;padding:3px 0 5px;border-bottom:1px solid var(--line)}
#thrT{flex:1;min-height:0;position:relative;touch-action:none}                                   /* the lever only ever moves in here, so it can't cover the number */
#thrF{position:absolute;left:0;right:0;bottom:0;height:calc(8px + (100% - 16px)*var(--p));background:linear-gradient(rgba(59,224,140,.78),rgba(31,143,88,.78))}
#thrH{position:absolute;left:5px;right:5px;bottom:calc(3px + (100% - 16px)*var(--p));height:10px;border-radius:5px;background:#eef3f6;border:1px solid rgba(11,17,23,.75);box-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
/* radio: a slim strip that opens only when a call is yours */
#radio{background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;pointer-events:auto}
#radio.live{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn)}
#rbar{display:flex;align-items:flex-start;gap:6px;padding:0 4px 0 8px;min-height:32px;cursor:pointer}
/* what ATC said (ATIS, clearances, your prompts) is always shown whole: the strip grows with it and scrolls past eight lines. Only your own grade line is kept short. */
#rlast{flex:1;min-width:0;font-size:12px;line-height:1.32;padding:8px 0;max-height:142px;overflow-y:auto;overflow-wrap:anywhere;touch-action:pan-y}
#rlast.gr,#rlast.you{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.45}
#rlast .who,#log .who{font:700 8.5px var(--f);letter-spacing:.12em;margin-right:6px;padding:1px 4px;border-radius:3px;vertical-align:1px;background:var(--tx);color:#0b1117}
/* the tuner: three frequencies, the one you are on lit and showing its number; the one a pending call belongs to blinks if you are somewhere else */
#rtag{display:flex;align-items:center;gap:3px;margin-left:auto;height:32px;flex:none}
#rtag button{font:700 9px var(--m);letter-spacing:.03em;color:var(--dim);background:#121b23;border:1px solid var(--ln2);border-radius:4px;height:23px;padding:0 6px;white-space:nowrap}
#rtag button.on{color:#0b1117;background:var(--cyan);border-color:var(--cyan)}#rtag button.need{border-color:var(--grn);color:var(--grn);animation:bl 1.1s infinite}
/* beginner mode: the call to make, word for word, with a button that drops it in the box */

    prompt:'Run-up done at the hold line'+(X2?' before Runway '+X2.join('-'):'')+'. There’s no taxiway down to the threshold: you’ll '+(X2?'cross the paved runway and ':'')+'taxi down the runway itself, the wrong way, so anyone on final must know. Look both ways and up the final, then announce it.',
    say:(X2?'crossing Runway '+X2W+', ':'')+'back-taxiing Runway '+RWl,els:[{l:'Back-taxiing',w:2,t:has(/\bback ?taxi(ing)?\b|\btaxi(ing)? back\b/)},ctRwy].concat(X2?[{l:'Crossing Runway '+X2.join('-'),w:1,t:n=>X2RE.test(n)?1:/\bcross(ing)?\b/.test(n)?0.4:0}]:[])}):null;
  const CDEP=ann('CDEP',{intent:{action:'departing',runway:RWY,intentions:{type:'closedTraffic',direction:'left'}},when:(S,s)=>END_TAXI?S.phase==='LINEUP'&&s.gs<3:(S.phase==='HOLD'&&s.gs<2)||S.phase==='LINEUP',
    skip:S=>!['TAXIOUT','HOLD','BACKTAXI','LINEUP'].includes(S.phase),delay:0.8,
    prompt:END_TAXI?'Turned round at the threshold. Look up the final for traffic, then announce that you’re departing Runway '+RWY+' and staying in the pattern.':'Run-up done at the hold-short line. Look up the final for traffic first, then announce that you’re departing Runway '+RWY+' and staying in the pattern.',
    say:'departing Runway '+RWl+', remaining in the pattern',els:[{l:'Departing',w:2,t:has(/\bdepart(ing|ure)?\b|\btaking off\b|\btakeoff\b|\brolling\b/)},ctRwy,
      {l:'Intentions (staying in the pattern)',w:1.5,t:has(/closed traffic|in the pattern|pattern work|touchandgo|remain(ing)? in|left traffic/)}]});
  const ctLap=lap=>{const last=lap===lastLap,iw=last?'full stop':'touch-and-go',gone=S=>S.lap>lap;return[
    ann('CDW'+lap,{intent:{position:{leg:'downwind',direction:'left',runway:RWY},intentions:last?'fullStop':'touchAndGo'},when:(S,s,rc)=>dw(S,lap)&&rc.a<L*0.6,skip:gone,
      prompt:'Left downwind for Runway '+RWY+'. Announce where you are and what this landing will be: '+(last?'a full stop.':'a touch-and-go.'),
      say:'left downwind Runway '+RWl+', '+iw,els:[{l:'Position (left downwind)',w:2,t:n=>/\bleft downwind\b/.test(n)?1:/\bdownwind\b/.test(n)?0.6:0},ctRwy,ctIntent(last)]}),
    ann('CBASE'+lap,{intent:{position:{leg:'base',direction:'left',runway:RWY}},when:S=>S.phase==='BASE'&&S.lap===lap,skip:gone,delay:0.5,
      prompt:'Turning base: announce it.',say:'left base Runway '+RWl,els:[{l:'Position (left base)',w:2,t:n=>/\bleft base\b/.test(n)?1:/\bbase\b/.test(n)?0.6:0},ctRwy]}),
    ann('CFIN'+lap,{intent:{position:{leg:'final',runway:RWY},intentions:last?'fullStop':'touchAndGo'},when:S=>S.phase==='FINAL'&&S.lap===lap,skip:gone,delay:fin?1.5:0.5,
      prompt:fin?'You’re on final for Runway '+RWY+' at '+CTN+', which has no tower. Announce it, and that this is a full stop.':'On final: announce it, '+(last?'full stop.':'touch-and-go.'),
      say:'final Runway '+RWl+', '+iw,els:[{l:'Position (final)',w:2,t:has(/\bfinal\b/)},ctRwy,ctIntent(last)]})];};
  const CCLR=ann('CCLR',{intent:{action:'clear',runway:RWY},when:S=>S.clear,delay:1.5,prompt:'',say:'clear of Runway '+RWl});
  CCLR.prep=S=>{const ex=S.exitTaken,re=ex?new RegExp('\\b'+ex.id.toLowerCase()+'\\b'):null;CCLR.intent=Object.assign({},CCLR.intent,{at:ex?ex.id:null,atName:ex?ex.n:null});
    const named=ex&&AP.exitsNamed!==false;
    CCLR.prompt='You’re clear of Runway '+RWY+(named?' on '+ex.n:'')+'. Announce it, so the next pilot knows the runway is free.';
    CCLR.model=CTN+' traffic, Cirrus four two seven alpha sierra, clear of Runway '+RWl+(named?' at '+ex.n:'')+', '+CTN+'.';
    CCLR.els=[ctOpen,ctCs,{l:'“Clear of Runway '+RWY+'”',w:3,t:n=>(/\bclear of\b|\bclear (the )?runway\b|\boff (the )?runway\b/.test(n)?0.5:0)+(RWRE.test(n)?0.5:0)},
      ...(named?[{l:'Where (at '+ex.n+')',w:0.5,t:n=>re&&re.test(n)?1:0}]:[]),ctEnd];};
  let q;
  if(AP.ctaf){q=fin?[ctLap(1)[2],CCLR]:CBACK?[CTAXI,CBACK,CDEP]:[CTAXI,CDEP];if(!fin)for(let l=1;l<=lastLap;l++)q.push(...ctLap(l));if(!fin)q.push(CCLR);return{q,lastLap,mkLand,canSequence:()=>false,sequence:()=>false};}
  if(fin){const L1=mkLand('LAND',()=>true,true);L1.delay=1.5;q=[L1,EXIT,PGND,GTAXI];}
  else{q=[PTAXI,GTX,P1];if(full)q.push(HOLD,LUAW);q.push(CFT);if(full)q.push(TNG,EXT,BASEOPT);q.push(PFULL,LAND);if(full)q.push(GA,MLT,LAND2);q.push(EXIT,PGND,GTAXI);}
  return{q,lastLap,mkLand,canSequence,sequence};
}

/* ---------- session: phases, flight grading, radio ---------- */
function Session(mode,emit){
  const sc=(err,tol)=>err<=tol?1:clamp(1-(err-tol)/(1.5*tol),0,1);
  const scr=buildScript(mode);
  const S={mode,phase:mode==='final'?'FINAL':'TAXIOUT',lap:1,circ:1,landings:0,items:[],calls:[],viol:[],done:{},firedAt:{},queue:scr.q,pending:null,simT:0,ended:false,
    abbrevOK:false,gaDone:false,gaAt:null,clr:AP.ctaf?{taxi:true,enter:true,takeoff:true,land:mode==='final'?'land':null,extend:false,goAround:false}:{taxi:mode==='final',enter:mode==='final',takeoff:mode==='final',land:null,extend:false,goAround:false},lastLap:scr.lastLap,
    freq:AP.ctaf?'CTAF':mode==='final'?'Tower':'Ground',clear:false,clearAt:0,exitId:null,exitN:null,exitTaken:null,ld:null,shut:null,parked:false,
    traffic:[],seq:null,seqOK:true};
  S.canSequence=()=>scr.canSequence(S,false);S.sequence=t=>scr.sequence(S,t);
  let seg=null,xwAlt=null,phaseT=0,altNag=0,nagged=false,adhoc=0,tk=null,excur=-1,taxiMax=0,offT=0,offV=false,parkT=0,reent=false,outMax=0,outOff=0,outOffV=false,outEarly=false;
  const newSeg=()=>({h:0,hn:0,a:0,am:0,an:0,v:0,vm:0,vn:0,c:0,cn:0,g:0,gn:0});
  seg=newSeg();
  const item=(group,name,val,target,score,w=1)=>{const it={lap:S.circ,group,name,val,target,score,w};S.items.push(it);return it;};
  const viol=(msg,atc,intent)=>{S.viol.push({lap:S.circ,msg});emit('viol',msg);if(atc&&!AP.ctaf)emit('atc',{text:atc,advisory:true,from:S.freq==='Ground'?'GND':'TWR',intent});};
  const setPhase=p=>{S.phase=p;seg=newSeg();phaseT=0;emit('phase',p);};
  const legDone=(group,from)=>emit('leg',{group,items:S.items.slice(from)});
  function finalize(score,res,text,missed){const p=S.pending;if(!p)return;
    S.calls.push({id:p.it.id,lap:S.circ,kind:p.it.kind,from:p.it.from||'TWR',atc:p.it.text||p.it.prompt,you:text||'',score,parts:res?res.parts:[],notes:res?res.notes:[],model:p.it.model,missed:!!missed});
    S.done[p.it.id]=true;S.pending=null;}
  function fire(it,s,rc){
    if(S.pending){const p=S.pending;finalize(p.first!=null?p.first*0.5:0,p.res||null,p.text||'',p.first==null);emit('missed',p.it);}
    if(it.prep)it.prep(S,s,rc);
    S.firedAt[it.id]=S.simT;if(it.eff)it.eff(S);
    if(it.kind==='atc'){if(it.text.indexOf(ABBR)===0)S.abbrevOK=true;S.pending={it};emit('atc',{text:it.text,from:it.from||'TWR',intent:it.intent});}
    else{S.pending={it};emit('prompt',{text:it.prompt,intent:it.intent});}
  }
  S.submit=function(text){
    if(!text.trim())return null;
    if(!S.pending){emit('note','No call pending — nothing to read back.');return null;}
    const p=S.pending,res=grade(text,p.it,S);
    if(p.it.kind==='atc'&&res.crit&&p.first==null){p.first=res.score;p.res=res;p.text=text;
      emit('graded',{res,text,retry:true});emit('atc',{text:(p.it.from==='GND'?FULL:ABBR)+', '+p.it.retry,advisory:true,from:p.it.from||'TWR',intent:{type:'verify',of:p.it.intent}});return res;}
    const score=p.first!=null?(p.first+res.score)/2:res.score;
    finalize(score,res,text,false);emit('graded',{res,text,final:score});return res;};
  S.sayAgain=function(){if(S.pending)emit(S.pending.it.kind==='atc'?'atc':'prompt',{text:S.pending.it.text||S.pending.it.prompt,repeat:true,from:S.pending.it.from||'TWR',intent:S.pending.it.intent});};
  // one landing's worth of grading, closed out once the airplane is slow, going again, or off the runway
  function closeLanding(s){const d=S.ld;if(!d||d.done)return;d.done=true;const td=d.td,m=S.items.length,ref=Math.round(AC.vs0*1.3);
    item('Landing','Sink rate at touchdown',Math.round(td.sink/10)*10+' fpm','≤ 250 fpm',td.sink<=250?1:clamp(1-(td.sink-250)/450,0,1),2);
    item('Landing','Touchdown speed',Math.round(td.ias)+' kt','≤ '+ref+' kt (1.3 × stall)',td.ias<=ref?1:clamp(1-(td.ias-ref)/12,0,1));
    item('Landing','Attitude at touchdown',td.noseFirst?'nose wheel first':(td.pitch>=0?'+':'−')+Math.abs(td.pitch).toFixed(0)+'° '+(td.pitch<1?'(flat)':'nose up')+(d.tail?' — tail strike':''),'mains first, nose 3–9° up',
      td.noseFirst?0:d.tail?0.3:td.pitch<1?0.4:td.pitch<2.5?0.8:1,2);
    item('Landing','Centerline at touchdown',Math.abs(td.c/FT).toFixed(0)+' ft '+(td.c>0?'left':'right'),'within 10 ft',sc(Math.abs(td.c),3));
    const z=td.a/FT;item('Landing','Touchdown point',Math.round(z/10)*10+' ft past the threshold','first third (≤ '+numT(AP.tdzFt)+' ft)',z<=AP.tdzFt?1:clamp(1-(z-AP.tdzFt)/1500,0,1));
    item('Landing','Bounces',d.bounces?d.bounces+' (up to '+d.maxB.toFixed(0)+' ft)':'none','none',d.bounces===0?1:d.bounces===1?0.5:0,2);
    if(d.roll)item('Landing','Rollout tracking','within '+Math.round(d.dev/FT)+' ft of centerline','within 10 ft',sc(d.dev,3));
    d.rating=td.noseFirst?'NOSE WHEEL FIRST':d.bounces>=2?'PORPOISED':d.bounces===1?'BOUNCED':td.sink<=120?'GREASER':td.sink<=250?'SMOOTH':td.sink<=400?'FIRM':'HARD';
    emit('landing',{rating:d.rating,sink:td.sink,ias:td.ias,pitch:td.pitch,dist:z,bounces:d.bounces});legDone('Landing',m);}

  S.update=function(s,dt){
    if(S.ended)return;
    S.simT+=dt;phaseT+=dt;
    const rc=toRwy(s.x,s.z),alt=s.y/FT+AP.elev,agl=s.y/FT,ias=s.V/KT,hdg=hdgOf(s),est=Math.abs(s.phi)<10*D2R,L=AP.len;
    while(S.queue.length&&S.queue[0].skip&&S.queue[0].skip(S))S.queue.shift();
    const it=S.queue[0];
    if(it){if(it.armed==null&&it.when(S,s,rc))it.armed=S.simT+(it.delay||0);
      if(it.armed!=null&&S.simT>=it.armed){S.queue.shift();fire(it,s,rc);}}
    if(!AP.ctaf&&S.phase==='DOWNWIND'&&!S.clr.land&&!S.clr.extend&&rc.a<L*0.2&&S.simT>adhoc&&!(S.seq&&!S.seq.based&&S.seq.lap===S.lap)){adhoc=S.simT+60;
      const last=S.lap>=S.lastLap;
      const ad=last?scr.mkLand('LANDx'+S.simT.toFixed(0),()=>true):{id:'OPT'+S.simT.toFixed(0),kind:'atc',intent:{type:'clearedForOption',runway:RWY},eff:S=>{S.clr.land='option';},
        text:ABBR+', Runway '+RWU+', cleared for the option.',model:'Runway '+RWl+', cleared for the option, Cirrus seven alpha sierra.',retry:'verify cleared for the option, Runway '+RWU+'.',
        els:[{l:'“Cleared for the option”',w:3,crit:true,t:has(/cleared (for )?(the )?option/)},E.rwy,E.cs(false)]};
      ad.delay=0;ad.when=()=>true;fire(ad,s,rc);}

    // no tower: nobody clears you to land; each circuit is yours to fly, touch-and-goes until the last, which is the full stop
    if(AP.ctaf&&!S.clr.land&&['UPWIND','CROSSWIND','DOWNWIND','BASE','FINAL'].includes(S.phase))S.clr.land=S.lap>=S.lastLap?'land':'tng';
    const n0=S.items.length,leg=AP.legs[S.phase];
    const onLeg=leg!=null&&est&&angDiff(hdg,leg)<25;
    if(s.onGround&&s.gs>8&&Math.abs(rc.c)>HW+1.5&&(S.phase==='ROLL'||S.phase==='ROLLOUT'||S.phase==='LINEUP')&&excur!==S.circ&&rc.a>-20&&rc.a<L+20&&!(!END_TAXI&&XC(rc.c)<0&&AP.exits.some(e=>Math.abs(e.a-rc.a)<9))){
      excur=S.circ;viol('Runway excursion — ran off the side of the runway.');}
    switch(S.phase){
    case 'TAXIOUT':{const ex=AP.exits[0];outMax=Math.max(outMax,s.gs);
      if(!S.clr.taxi&&!outEarly&&Math.hypot(rc.a-AP.park.a,rc.c-AP.park.c)>12){outEarly=true;viol('Taxied without a clearance — call Ground before you move.',FULL+', '+AP.name+' Ground, hold position.',{type:'holdPosition',reason:'noTaxiClearance'});}
      if(!onPavement(rc)&&s.gs>1.5){outOff+=dt;if(outOff>1.5&&!outOffV){outOffV=true;viol('Taxied off the pavement.');}}else outOff=0;
      if(END_TAXI){const H=AP.hold,on=onTurf(rc);                           // stopped at the hold line before the other runway, or (not stopping) on the turf already
        if(on||(Math.abs(rc.a-H.a)<H.w&&Math.abs(rc.c-H.c)<H.w&&s.gs<3)){item('Taxi out','Taxi speed','up to '+Math.round(outMax/KT)+' kt','20 kt or less',sc(Math.max(0,outMax/KT-20),5));legDone('Taxi out',n0);setPhase(on?'BACKTAXI':'HOLD');}
        break;}
      if(XC(rc.c)>XC(AP.holdC)&&rc.a>-20&&rc.a<L+20&&!S.incur&&!S.clr.enter){S.incur=true;viol('Runway incursion — crossed the hold-short line without a clearance.',FULL+', '+AP.name+' Ground, hold position.',{type:'holdPosition',reason:'runwayIncursion'});}
      if(Math.abs(rc.c)<AP.wid/2+2&&rc.a>-5){if(!AP.ctaf)S.freq='Tower';setPhase('LINEUP');}
      else if(XC(rc.c)>XC(AP.holdC)-42&&XC(rc.c)<XC(AP.holdC)+2&&Math.abs(rc.a-ex.a)<(AP.osm?20:9)){
        item('Taxi out','Taxi speed','up to '+Math.round(outMax/KT)+' kt','20 kt or less',sc(Math.max(0,outMax/KT-20),5));legDone('Taxi out',n0);if(!AP.ctaf)S.freq='Tower';setPhase('HOLD');}
      break;}
    case 'HOLD':
      if(END_TAXI){if(onTurf(rc))setPhase('BACKTAXI');break;}
      if(XC(rc.c)>XC(AP.holdC)&&!S.clr.enter&&!S.incur){S.incur=true;viol('Runway incursion — crossed the hold-short line without a clearance.',ABBR+', hold position. You were not cleared onto the runway.',{type:'holdPosition',reason:'runwayIncursion'});}
      if(Math.abs(rc.c)<AP.wid/2+2&&rc.a>-5)setPhase('LINEUP');break;
    case 'BACKTAXI':                                                     // down the turf the wrong way; lined up once turned round to the runway's heading
      if(angDiff(hdg,AP.hdg)<20&&rc.a<AP.len-150&&Math.abs(rc.c)<HW)setPhase('LINEUP');break;
    case 'LINEUP':
      if(s.gs>12){if(!S.clr.takeoff)viol('Took off without a takeoff clearance.',ABBR+', you were not cleared for takeoff.',{type:'notCleared',what:'takeoff'});tk={dev:0,t:S.simT};setPhase('ROLL');}break;
    case 'ROLL':
      if(s.onGround&&tk)tk.dev=Math.max(tk.dev,Math.abs(rc.c));
      if(!s.onGround&&agl>3){xwAlt=null;
        if(tk&&S.simT-tk.t>6){const v=AC.vr,sp=ias<v-3?clamp(1-(v-3-ias)/8,0,1):ias>v+13?clamp(1-(ias-v-13)/10,0,1):1;
          item('Takeoff','Centerline on the roll','within '+Math.round(tk.dev/FT)+' ft','within 10 ft',sc(tk.dev,3));
          item('Takeoff','Lift-off speed',Math.round(ias)+' kt',(v-3)+'–'+(v+13)+' kt',sp);
          if(s.tail){item('Takeoff','Rotation','tail strike','smooth, no tail strike',0);s.tail=false;}
          legDone('Takeoff',n0);}
        tk=null;setPhase('UPWIND');}
      else if(s.onGround&&s.gs<3&&phaseT>4&&s.thr<0.3)setPhase('LINEUP');break;
    case 'UPWIND':
      if(s.justLanded&&s.lastTD.maxAgl<60){s.justLanded=false;setPhase('ROLL');break;}
      if(onLeg&&agl>50){seg.h+=angDiff(hdg,AP.legs.UPWIND)*dt;seg.hn+=dt;}
      if(xwAlt==null&&s.phi<-8*D2R&&agl>100)xwAlt=alt;
      if(angDiff(hdg,AP.legs.CROSSWIND)<35&&agl>100){
        if(seg.hn>2)item('Upwind','Runway heading','±'+(seg.h/seg.hn).toFixed(0)+'°',HDG3+'° ±10',sc(seg.h/seg.hn,10));
        const xa=Math.round((xwAlt==null?alt:xwAlt)/10)*10;
        item('Upwind','Crosswind turn started at',xa.toLocaleString()+' ft','≥ 1,000 ft (within 300 of TPA)',xa>=990?1:clamp((xa-700)/300,0,1));
        legDone('Upwind',n0);setPhase('CROSSWIND');}
      break;
    case 'CROSSWIND':
      if(onLeg){seg.h+=angDiff(hdg,AP.legs.CROSSWIND)*dt;seg.hn+=dt;}
      if(angDiff(hdg,AP.legs.DOWNWIND)<35){
        if(seg.hn>2)item('Crosswind','Heading','±'+(seg.h/seg.hn).toFixed(0)+'°',p3(AP.legs.CROSSWIND)+'° ±10',sc(seg.h/seg.hn,10));
        item('Crosswind','Altitude rolling onto downwind',(Math.round(alt/10)*10).toLocaleString()+' ft',TPAT+' ft ±100',sc(Math.abs(alt-AP.tpa),100));
        legDone('Crosswind',n0);nagged=false;altNag=0;setPhase('DOWNWIND');}
      break;
    case 'DOWNWIND':
      if(onLeg){seg.h+=angDiff(hdg,AP.legs.DOWNWIND)*dt;seg.hn+=dt;seg.c+=rc.c*dt;seg.cn+=dt;
        if(phaseT>8&&rc.a>0){seg.v+=Math.abs(ias-100)*dt;seg.vm+=ias*dt;seg.vn+=dt;}
        if(phaseT>5&&rc.a>0){seg.a+=Math.abs(alt-AP.tpa)*dt;seg.am+=alt*dt;seg.an+=dt;}}
      if(rc.a>0&&Math.abs(alt-AP.tpa)>200)altNag+=dt;else altNag=0;
      if(altNag>6&&!nagged&&!AP.ctaf){nagged=true;emit('atc',{text:ABBR+', check altitude. Pattern altitude is '+TPAW+'.',advisory:true,from:'TWR',intent:{type:'checkAltitude',altitude:AP.tpa}});}
      if(angDiff(hdg,AP.legs.BASE)<35&&rc.a<700){
        if(S.clr.extend)viol('Turned base before Tower called it — you were told to extend downwind.',ABBR+', I said extend downwind. Continue, I’ll call your base.',{type:'extendDownwind',willCallBase:true,reminder:true});
        if(seg.an>3)item('Downwind','Altitude',Math.round(seg.am/seg.an/10)*10+' ft avg, ±'+Math.round(seg.a/seg.an),TPAT+' ft ±100',sc(seg.a/seg.an,100),2);
        if(seg.hn>3)item('Downwind','Heading','±'+(seg.h/seg.hn).toFixed(0)+'°',p3(AP.legs.DOWNWIND)+'° ±10',sc(seg.h/seg.hn,10));
        if(seg.vn>3)item('Downwind','Airspeed',Math.round(seg.vm/seg.vn)+' kt avg','100 kt ±10',sc(seg.v/seg.vn,10));
        if(seg.cn>3)item('Downwind','Spacing from runway',(seg.c/seg.cn/NM).toFixed(2)+' NM','about 1 NM',1,0);
        legDone('Downwind',n0);setPhase('BASE');}
      break;
    case 'BASE':
      if(onLeg){seg.h+=angDiff(hdg,AP.legs.BASE)*dt;seg.hn+=dt;seg.v+=Math.abs(ias-90)*dt;seg.vm+=ias*dt;seg.vn+=dt;}
      if(angDiff(hdg,AP.legs.FINAL)<35){
        if(seg.hn>2)item('Base','Heading','±'+(seg.h/seg.hn).toFixed(0)+'°',p3(AP.legs.BASE)+'° ±15',sc(seg.h/seg.hn,15));
        if(seg.vn>2)item('Base','Airspeed',Math.round(seg.vm/seg.vn)+' kt avg','90 kt ±10',sc(seg.v/seg.vn,10));
        const fl=Math.max(0,-rc.a)/NM;item('Base','Final approach length',fl.toFixed(1)+' NM at '+Math.round(agl/10)*10+' ft AGL','¾ NM or more',fl>=0.75?1:clamp(fl/0.75,0,1));

        seg.g+=Math.abs(Math.atan2(s.y,AP.aim-rc.a)/D2R-3)*dt;seg.gn+=dt;}
      if(S.clr.goAround&&S.gaAt!=null&&!S.gaResp&&s.vs>1){S.gaResp=true;const d=S.simT-S.gaAt;
        item('Go-around','Positive climb after the call',d.toFixed(0)+' s','≤ 8 s',sc(d,8),2);legDone('Go-around',n0);}
      if(!s.onGround&&s.vs>1&&agl>80&&rc.a>-200&&s.thr>0.7){
        if(S.clr.goAround)S.gaDone=true;S.circ++;S.clr.goAround=false;S.clr.land=null;S.gaResp=false;S.gaAt=null;xwAlt=null;setPhase('UPWIND');}

    case 'ROLLOUT':{const d=S.ld;
      if(d&&!d.done&&s.onGround){d.dev=Math.max(d.dev,Math.abs(rc.c));if(s.tail){d.tail=true;s.tail=false;}}
      if(S.clr.land!=='land'&&s.thr>0.6){closeLanding(s);S.lap++;S.circ++;S.clr.land=null;tk={dev:0,t:S.simT-20};setPhase('ROLL');}

      const g=ctx.createGain();g.gain.value=0.0001;g.gain.linearRampToValueAtTime(lvl,ctx.currentTime+0.05);
      const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.type='sawtooth';lfo.frequency.value=5.3+G*3;lg.gain.value=lvl*(G?0.55:0.15);lfo.connect(lg);lg.connect(g.gain);lfo.start();
      const hum=ctx.createOscillator(),hg=ctx.createGain();hum.type=G?'sawtooth':'sine';hum.frequency.value=G?120:400;hg.gain.value=G?0.006+G*0.004:0.004;hum.connect(hg);hg.connect(rOut());hum.start();
      s.connect(hp);hp.connect(lp);lp.connect(pk);pk.connect(g);g.connect(rOut());s.start();hiss={s,g,hum,lfo};
      clearInterval(crk);if(G)crk=setInterval(()=>{if(!hiss||!ctx)return;const n=1+(Math.random()*2*G|0);for(let i=0;i<n;i++)burst(ctx.currentTime+Math.random()*0.12,0.012+Math.random()*0.05,(0.1+Math.random()*0.22)*G,700+Math.random()*2600,0.7+Math.random()*3);},140);}
    else if(!on&&hiss){const h=hiss;hiss=null;clearInterval(crk);h.g.gain.cancelScheduledValues(ctx.currentTime);h.g.gain.setValueAtTime(lvl,ctx.currentTime);h.g.gain.linearRampToValueAtTime(0.0001,ctx.currentTime+0.04);setTimeout(()=>{try{h.s.stop();h.hum.stop();h.lfo.stop();}catch(e){}},80);}}catch(e){}}
  function keyUp(){if(!ctx||hiss)return;const t=ctx.currentTime;click(t);burst(t,0.07,0.12,1900,0.8);carrier(true);}
  function keyDown(){if(!ctx)return;carrier(false);const t=ctx.currentTime,G=opt.grit|0;burst(t+0.02,0.16+G*0.06,0.2+G*0.12,1700,0.6);click(t+0.17+G*0.06);}
  function pick(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return null;
      const want=[...((opt.grit|0)?[/ralph/i,/\bfred\b/i,/albert/i,/bruce/i]:[]),/aaron/i,/\balex\b/i,/daniel/i,/google us english/i,/microsoft (guy|david|andrew|brian)/i,/fred/i,/tom/i,/male/i];
      for(const re of want){const v=vs.find(v=>re.test(v.name)&&(/en[-_]US/i.test(v.lang)||/daniel/i.test(v.name)));if(v)return v;}

  function done(){busy=Math.max(0,busy-1);if(!busy)keyDown();}
  function say(t,who){if(!opt.voice)return;init();if(ctx&&ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
    const words=t.split(/\s+/).length,est=Math.max(1.2,words*0.3);

  function unlock(){init();try{if(ctx&&ctx.state==='suspended')ctx.resume();}catch(e){}try{if(window.speechSynthesis){speechSynthesis.getVoices();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}}catch(e){}}
  function mine(){if(!opt.voice)return;init();if(!ctx)return;const t=ctx.currentTime;click(t);burst(t,0.05,0.07,2100,0.9);burst(t+0.28,0.1,0.12,1700,0.6);click(t+0.37);}
  function stop(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}busy=0;carrier(false);}
  try{if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{voice=pick();};}catch(e){}
  function vol(v){opt.rvol=Math.max(0,Math.min(1,+v||0));try{if(out)out.gain.setTargetAtTime(opt.rvol,ctx.currentTime,0.05);}catch(e){}if(opt.rvol<=0.001)try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}return opt.rvol;}
  return{vol,say,unlock,mine,stop,repick(){voice=pick();},ctx(){init();return ctx;},noise(){return noise;},busy(){return busy>0||!!hiss;},wake(){try{if(ctx&&ctx.state!=='running')ctx.resume();}catch(e){}}};})();
function speak(t,who){Radio.say(t,who);}

/* ---- cockpit sound, all synthesised: engine + prop, airflow, tyre rumble, flap motor, stall horn, touchdown ---- */
const Sfx=(function(){let ctx=null,n=null,tdSeen=0,ntSeen=0,duck=1;
  function build(){ctx=Radio.ctx();if(!ctx||n||!Radio.noise())return;try{
    const g=v=>{const x=ctx.createGain();x.gain.value=v;return x;},osc=(ty,f)=>{const o=ctx.createOscillator();o.type=ty;o.frequency.value=f;o.start();return o;},
      nz=()=>{const b=ctx.createBufferSource();b.buffer=Radio.noise();b.loop=true;b.start();return b;},bq=(ty,f,q)=>{const x=ctx.createBiquadFilter();x.type=ty;x.frequency.value=f;if(q)x.Q.value=q;return x;};
    const master=g(0),cabin=bq('lowpass',3600);master.connect(cabin);cabin.connect(ctx.destination);
    const o1=osc('sawtooth',40),o2=osc('sawtooth',80),o3=osc('square',60),g1=g(0.5),g2=g(0.3),g3=g(0.2),elp=bq('lowpass',900,0.8),eg=g(0);
    o1.connect(g1);o2.connect(g2);o3.connect(g3);[g1,g2,g3].forEach(x=>x.connect(elp));elp.connect(eg);eg.connect(master);
    const enb=bq('bandpass',300,0.9),eng=g(0);nz().connect(enb);enb.connect(eng);eng.connect(master);
    const wb=bq('bandpass',900,0.6),wg=g(0);nz().connect(wb);wb.connect(wg);wg.connect(master);
    const rb=bq('bandpass',240,0.8),rg=g(0);nz().connect(rb);rb.connect(rg);rg.connect(master);
    const hg=g(0),hm=g(0.5);osc('square',2750).connect(hg);osc('square',2760).connect(hm);hm.connect(hg);hg.connect(ctx.destination);
    const fb=bq('bandpass',700,2),fg=g(0);osc('sawtooth',190).connect(fb);fb.connect(fg);fg.connect(master);
    n={master,cabin,o1,o2,o3,elp,eg,enb,eng,wb,wg,rg,hg,fg};}catch(e){n=null;}}
  const set=(p,v,tc)=>{try{p.setTargetAtTime(v,ctx.currentTime,tc||0.08);}catch(e){}};
  function thump(gv,f0){if(!ctx||!opt.sfx)return;try{const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(f0||170,t);o.frequency.exponentialRampToValueAtTime(60,t+0.16);
    g.gain.setValueAtTime(gv,t);g.gain.exponentialRampToValueAtTime(0.0008,t+0.2);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.24);}catch(e){}}
  function chirp(k){if(!ctx||!opt.sfx)return;try{const t=ctx.currentTime,b=ctx.createBufferSource();b.buffer=Radio.noise();b.loop=true;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=5;
    f.frequency.setValueAtTime(2900,t);f.frequency.exponentialRampToValueAtTime(1500,t+0.13);const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.2*k,t+0.012);g.gain.exponentialRampToValueAtTime(0.0008,t+0.17);
    b.connect(f);f.connect(g);g.connect(ctx.destination);b.start(t);b.stop(t+0.2);}catch(e){}}
  // A tyre spinning up on touchdown: the rubber sticks and slips against the runway, a pitched squeal that sags as the
  // wheel comes up to speed, rough with a fast flutter, over a hiss of scrubbed rubber. k: how hard (sink rate and
  // groundspeed); delay: seconds (the second main wheel lands a moment after the first); pitch: Hz; o: where the camera is.
  function squeal(k,delay,pitch,o){if(!ctx||!opt.sfx)return;try{const t=ctx.currentTime+delay,len=0.09+0.32*Math.min(1,k),near=o.near==null?1:o.near;
    const tn=ctx.createOscillator();tn.type='sawtooth';tn.frequency.setValueAtTime(pitch*1.12,t);tn.frequency.exponentialRampToValueAtTime(pitch*0.8,t+len);
    const fl=ctx.createOscillator();fl.frequency.value=38+Math.random()*20;const flg=ctx.createGain();flg.gain.value=pitch*0.05;fl.connect(flg);flg.connect(tn.frequency);
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=3.5;bp.frequency.setValueAtTime(pitch*1.1,t);bp.frequency.exponentialRampToValueAtTime(pitch*0.85,t+len);
    const nz=ctx.createBufferSource();nz.buffer=Radio.noise();nz.loop=true;const hb=ctx.createBiquadFilter();hb.type='bandpass';hb.frequency.value=pitch*1.6;hb.Q.value=1.2;
    const tg=ctx.createGain();tg.gain.value=0.5;const ng=ctx.createGain();ng.gain.value=0.6;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=o.cockpit?2200:7000;   // from the seat it comes through the airframe, duller
    const g=ctx.createGain(),peak=Math.max(0.0002,0.16*k*near);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+0.008);g.gain.setValueAtTime(peak*0.85,t+len*0.35);g.gain.exponentialRampToValueAtTime(0.0006,t+len);
    tn.connect(bp);bp.connect(tg);tg.connect(lp);nz.connect(hb);hb.connect(ng);ng.connect(lp);lp.connect(g);g.connect(ctx.destination);
    const end=t+len+0.03;tn.start(t);fl.start(t);nz.start(t);tn.stop(end);fl.stop(end);nz.stop(end);}catch(e){}}
  let jet=null;
  function jetSound(level,near,muted,cockpit){if(!ctx||!n)return;try{
    if(!jet){const nz=ctx.createBufferSource();nz.buffer=Radio.noise();nz.loop=true;nz.start();const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=0.6;
      const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5000;const ng=ctx.createGain();ng.gain.value=0;const wh=ctx.createOscillator();wh.type='sine';wh.frequency.value=2900;wh.start();
      const wg=ctx.createGain();wg.gain.value=0;nz.connect(bp);bp.connect(ng);ng.connect(lp);wh.connect(wg);wg.connect(lp);lp.connect(ctx.destination);jet={bp,lp,ng,wg,wh};}
    const k=muted||!opt.sfx?0:level*near;set(jet.ng.gain,0.55*k,0.4);set(jet.wg.gain,0.03*k*(0.4+0.6*near),0.4);set(jet.wh.frequency,2400+900*level,0.8);set(jet.bp.frequency,300+380*level,0.6);set(jet.lp.frequency,cockpit?1100:5200,0.2);}catch(e){}}
  function update(s,o){
    if(!opt.sfx){if(n)set(n.master.gain,0,0.05);return;}
    if(!n){if(o.muted)return;build();if(!n)return;}
    const A=C.AC,pw=s.thr*s.eng,rpm=(1000+1700*Math.pow(s.thr,0.7))*s.eng,f=Math.max(6,rpm/60*(A.hp>250?3:2))*o.dop;
    set(n.o1.frequency,f,0.1);set(n.o2.frequency,f*2.012,0.1);set(n.o3.frequency,Math.max(6,rpm/60*3*1.004*o.dop),0.1);
    set(n.elp.frequency,(o.cockpit?560:850)+pw*(o.cockpit?1150:2300),0.15);
    duck+=((Radio.busy()?0.42:1)-duck)*0.08;
    set(n.eg.gain,s.eng*(0.05+0.115*Math.pow(s.thr,0.8))*(o.cockpit?1.1:1)*o.dist*duck);

    set(n.wb.frequency,500+s.V*14);set(n.wg.gain,Math.pow(C.clamp((s.V-22)/55,0,1),2)*0.055*(o.cockpit?0.85:1)*o.near*duck);
    set(n.rg.gain,s.onGround?C.clamp(s.gs/38,0,1)*(s.turf?0.2:0.13)*o.near:0,0.05);
    set(n.hg.gain,(!s.onGround&&s.stallWarn&&!o.muted)?0.034:0,0.02);
    set(n.fg.gain,Math.abs(s.flaps-s.flapPos)>0.01?0.02*o.near:0,0.05);
    set(n.cabin.frequency,o.cockpit?1700:4600,0.2);
    set(n.master.gain,o.muted?0:(o.typing?0.45:1),0.12);
    // Mains down: both tyres squeal, one a moment after the other (longer apart with a wing down), louder and longer
    // the harder and faster it lands. A greaser still gives a faint chirp-chirp; a hard one a long screech and a thump.
    if(s.tdN!==tdSeen){tdSeen=s.tdN;if(s.gs>8&&!o.muted){const sink=Math.max(0,s.tdSink||0),k=C.clamp((0.3+sink/380)*C.clamp(s.gs/30,0.5,1.2),0.25,1.5),
      lag=0.012+Math.min(0.09,Math.abs(s.phi)*0.6)+Math.random()*0.02,p=1500+Math.random()*250;
      if(s.turf)thump(0.16*C.clamp((sink+60)/450,0.3,1.5),110);                                         // on grass: no rubber squeal, just the wheels thudding down
      else{squeal(k,0,p,o);squeal(k*0.8,lag,p*1.06,o);if(sink>35)thump(0.22*C.clamp(sink/450,0.3,1.5));}}}
    // The nose wheel spins up too: a short, small chirp.
    if(s.ntN!==ntSeen){ntSeen=s.ntN;if(!o.muted&&s.gs>3){thump(0.1,140);if(s.gs>12&&!s.turf)squeal(0.25,0,1900,o);}}
  }
  return{update,jet:jetSound,sync(s){tdSeen=s.tdN;ntSeen=s.ntN;},off(){if(n)set(n.master.gain,0,0.05);if(jet)jetSound(0,0,true,false);},crash(){thump(0.5,130);chirp(1.6);}};})();

const sym=v=>v>=0.99?'<span class="ok">✓</span>':v>=0.5?'<span class="half">△</span>':'<span class="no">✗</span>';
const SHORT={'Runway heading':'HDG','Crosswind turn started at':'TURN ALT','Heading':'HDG','Altitude rolling onto downwind':'ALT','Altitude':'ALT','Airspeed':'SPD','Centerline':'CL',
  'Approach speed':'SPD','Glidepath':'PATH','Flaps at touchdown':'FLAPS','Positive climb after the call':'CLIMB','Centerline on the roll':'CL','Lift-off speed':'VR','Final approach length':'FINAL',
  'Runway exit':'EXIT','Taxi speed':'TAXI','Parked':'PARK'};
let toastT=0;function toast(html,ms){if(bot.on&&/^<b>(GAMEPAD|VIEW|BEGINNER|GRAPHICS|FULL SCREEN)/.test(html))return;   // hints for a person holding a device: a bot has none
  const t=$('toast');t.innerHTML=html;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms||5000);}
const RATE_CLS={GREASER:'ok',SMOOTH:'ok',FIRM:'half',HARD:'no',BOUNCED:'half',PORPOISED:'no','NOSE WHEEL FIRST':'no'};
function onEvent(ty,d){
  botSession(ty,d);
  if(ty==='atc'){const w=d.from==='GND'?'GND':'TWR',need=w==='GND'?'Ground':'Tower';
    if(tuned!==need&&opt.beg)tune(need,true);                                      // beginner mode follows the hand-offs for you
    if(tuned!==need){unheard=true;toast('<b>RADIO</b>'+FQ[need].name+' is calling — you’re on '+FQ[tuned].tag+'. Tap '+FQ[need].tag+'.',6500);   // you only hear the frequency you are on
      say('gr','','<span class="no">'+FQ[need].name+' is calling you.</span> You’re on '+FQ[tuned].name+' — tap <b>'+FQ[need].tag+'</b> to hear it.');return;}
    unheard=false;say('atc'+(w==='GND'?' gnd':''),w,esc(d.text));speak(d.text,w);if(!d.advisory||ses.pending){setLive(true);rbIn.placeholder='Read it back…';}}
  else if(ty==='prompt'){if(opt.beg&&tuned!==ses.freq)tune(ses.freq,true);say('prm','YOUR CALL',esc(d.text));setLive(true);rbIn.placeholder=AP.ctaf?(AP.say||AP.name)+' traffic, Cirrus 427AS, …':ses.freq==='Ground'?AP.name+' Ground, Cirrus 427AS, …':AP.name+' Tower, Cirrus 427AS, …';}
  else if(ty==='graded'){say('you','YOU',esc(d.text));const r=d.res,pc=Math.round(r.score*100);
    let h='<span class="sc '+(pc>=90?'ok':pc>=60?'half':'no')+'">'+pc+'%</span>'+r.parts.map(p=>sym(p.v)+' '+esc(p.l)).join(' &nbsp;');
    if(r.notes.length)h+='<br>'+r.notes.map(esc).join(' ');
    if(r.score<0.995&&!d.retry)h+='<q>'+esc(r.model)+'</q>';
    const miss=r.parts.filter(p=>p.v<0.99),sl=p=>esc(p.l.replace(/\s*\(.*$/,'')),sm='<span class="sc '+(pc>=90?'ok':pc>=60?'half':'no')+'">'+pc+'%</span>'+(miss.length?miss.map(p=>sym(p.v)+' '+sl(p)).join(' &nbsp;')+' &nbsp;<span class="hint">▲ for the model call</span>':'<span class="ok">✓</span> all '+r.parts.length+' items');
    if(!d.retry)setLive(false);say('gr','',h,sm);if(!d.retry)rbIn.placeholder='Type your radio call…';}
  else if(ty==='missed'){say('gr','','<span class="no">No readback on the last call — scored 0.</span>');setLive(false);}
  else if(ty==='note'){say('gr','',esc(d));}
  else if(ty==='viol'){say('vio','','⚠ '+esc(d));toast('<span class="no">⚠ '+esc(d)+'</span>',7000);}
  else if(ty==='leg'){const it=d.items.filter(i=>SHORT[i.name]);if(it.length&&d.group!=='Landing')toast('<b>'+d.group.toUpperCase()+'</b>'+it.map(i=>SHORT[i.name]+' '+sym(i.score)).join(' · '));}
  else if(ty==='phase'){if(d==='UPWIND'||d==='DOWNWIND')prof=[];}
  else if(ty==='touchdown'){G.thump(Math.min(1.4,d.sink/420));try{if(navigator.vibrate)navigator.vibrate(Math.round(Math.min(140,25+d.sink/4)));}catch(e){}toast('<b>TOUCHDOWN</b>'+Math.round(d.sink/10)*10+' fpm · '+Math.round(d.ias)+' kt',2600);
    profs.push({lap:ses.circ,t:ses.simT,pts:prof.slice(),a:C.toRwy(s.x,s.z).a,sink:d.sink,ias:d.ias,open:true});prof=[];if(profs.length>4)profs.shift();}
  else if(ty==='landing'){const cp=profs[profs.length-1];if(cp)cp.rating=d.rating;toast('<b class="r '+(RATE_CLS[d.rating]||'half')+'">'+d.rating+'</b>'+Math.round(d.sink/10)*10+' fpm · '+Math.round(d.ias)+' kt · '+(Math.round(d.dist/10)*10).toLocaleString()+' ft down the runway'+(d.bounces?' · '+d.bounces+' bounce'+(d.bounces>1?'s':''):''),9000);
    say('gr','','<span class="sc '+(RATE_CLS[d.rating]||'half')+'">'+d.rating+'</span>touchdown '+Math.round(d.sink/10)*10+' fpm, '+Math.round(d.ias)+' kt, nose '+(d.pitch>=0?'+':'−')+Math.abs(d.pitch).toFixed(0)+'°, '+(Math.round(d.dist/10)*10).toLocaleString()+' ft past the threshold');}
  else if(ty==='bounce'){G.thump(0.6);toast('<b class="half">BOUNCE</b>Hold that attitude and let it settle — or full power and go around',5000);}
  else if(ty==='shutdown'){toast('<b class="ok">PARKED</b>Mixture to cutoff… shutting down',4000);}
  else if(ty==='end'){debrief(d&&d.parked?'Parked and shut down':'Session complete',d&&d.parked?'Chocks in. Here’s how it went.':'');}
}
// one transmission, from the box (a person) or from SimBot.radio(): the same path either way
function transmit(v,fromBox){if(!v.trim()||!ses)return{sent:false,why:!ses?'no session':'nothing to send'};
  if(tuned==='ATIS'){say('gr','',AP.ctaf?'<span class="no">The AWOS is a recording — nobody hears you there.</span> Tap <b>CTAF</b>, then transmit.':'<span class="no">ATIS is a recording — nobody hears you there.</span> Tap <b>GND</b> or <b>TWR</b>, then transmit.');return{sent:false,why:'tuned to ATIS'};}
  if(ses.pending&&tuned!==ses.freq){const need=ses.freq,w=tuned==='Ground'?'GND':'TWR',t='Cirrus four two seven alpha sierra, this is '+AP.name+' '+tuned+', contact '+need+' on '+C.W.fqW(FQ[need].n)+'.';   // right call, wrong controller: it is not graded, and your text stays in the box to send again
    Radio.mine();say('you','YOU',esc(v));rbIn.blur();setTimeout(()=>{if(!ses||tuned==='ATIS')return;say('atc'+(w==='GND'?' gnd':''),w,esc(t));speak(t,w);toast('<b>WRONG FREQUENCY</b>That call goes to '+FQ[need].name+' — tap '+FQ[need].tag+' and send it again',6500);
      botEmit('atc',{facility:w,text:t,advisory:true,heard:true,intent:{type:'contact',facility:need==='Ground'?'GND':'TWR',freq:FQ[need].n}});},1300);return{sent:true,graded:false,why:'wrong frequency'};}

function readInput(dt){
  if(bot.on){ // SimBot flies: its controls only. Yoke and rudder settle as a game controller's do; the power lever moves at the power key's rate.
    const c=bot.c,n=v=>C.clamp(+v||0,-1,1),k=Math.min(1,dt*16);
    inp.pitch+=(n(c.pitch)-inp.pitch)*k;inp.roll+=(n(c.roll)-inp.roll)*k;inp.rud+=(n(c.yaw)-inp.rud)*Math.min(1,dt*8);kp=0;
    if(c.throttle!=null){const d=C.clamp(+c.throttle||0,0,1)-s.thr;s.thr+=Math.sign(d)*Math.min(Math.abs(d),0.45*dt);}
    if(c.flaps!=null)s.flaps=C.clamp(Math.round(+c.flaps||0),0,2);
    if(c.trim)s.trim=C.clamp(s.trim+n(c.trim)*1.25*D2R*dt,C.TRIM_MIN,C.TRIM_MAX);
    s.brake=(+c.brakeL||0)>0.5||(+c.brakeR||0)>0.5;return;}
  const cur=v=>Math.sign(v)*Math.pow(Math.abs(v),1.6),dz=v=>Math.abs(v)<0.1?0:(v-Math.sign(v)*0.1)/0.9;
  let pad=null;try{const ps=navigator.getGamepads?navigator.getGamepads():[];for(const p of ps)if(p&&p.connected&&p.axes&&p.axes.length>=2&&p.buttons&&p.buttons.length>=8){pad=p;break;}}catch(e){}
  const kbP=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),kbR=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let tp,tr,ru=(keys.x?1:0)-(keys.z?1:0),thd=(keys.e||keys.pageup||keys['=']?1:0)-(keys.q||keys.pagedown||keys['-']?1:0),trimDir=trimHold||((keys[']']||keys.Numpad1?1:0)-(keys['[']||keys.Numpad7?1:0));
  padPrev.brake=false;
  if(pad){const b=i=>!!(pad.buttons[i]&&pad.buttons[i].pressed),v=i=>pad.buttons[i]?pad.buttons[i].value:0,edge=(n,on)=>{const was=padPrev[n];padPrev[n]=on;return on&&!was;};
    if(!padSeen&&(Math.abs(pad.axes[0])>0.25||Math.abs(pad.axes[1])>0.25||pad.buttons.some(x=>x.pressed))){padSeen=true;toast('<b>GAMEPAD</b>Left stick flies · triggers rudder · A/B power · LB/RB flaps · D-pad trim · X brakes · Y view',7000);}
    if(padSeen){ru+=v(7)-v(6);thd+=(b(0)?1:0)-(b(1)?1:0)-(pad.axes.length>3?dz(pad.axes[3]):0);trimDir=trimDir||((b(13)?1:0)-(b(12)?1:0));padPrev.brake=b(2);
      if(edge('rb',b(5)))flap(1);if(edge('lb',b(4)))flap(-1);if(edge('y',b(3)))nextCam();if(edge('st',b(9)))$('bPause').click();}}
  if(joy.on){tp=cur(joy.y);tr=cur(joy.x);inp.pitch+=(tp-inp.pitch)*Math.min(1,dt*16);inp.roll+=(tr-inp.roll)*Math.min(1,dt*16);kp=0;}
  else if(pad&&padSeen&&!kbP&&!kbR){tp=cur(dz(pad.axes[1]));tr=cur(dz(pad.axes[0]));inp.pitch+=(tp-inp.pitch)*Math.min(1,dt*16);inp.roll+=(tr-inp.roll)*Math.min(1,dt*16);kp=0;}
  else{ // keyboard: with stick-and-trim handling a held key walks the stick out and it springs back; with attitude hold it is a plain rate command
    if(s.assist){inp.pitch+=(kbP*0.8-inp.pitch)*Math.min(1,dt*9);kp=0;}
    else{if(kbP)kp=C.clamp(kp+kbP*0.75*dt+(Math.sign(kp)!==kbP&&kp?kbP*1.6*dt:0),-1,1);else kp-=Math.sign(kp)*Math.min(Math.abs(kp),2.4*dt);inp.pitch=kp;}
    inp.roll+=(kbR-inp.roll)*Math.min(1,dt*9);}
  inp.rud+=(C.clamp(ru,-1,1)-inp.rud)*Math.min(1,dt*8);
  if(thd)s.thr=C.clamp(s.thr+thd*0.45*dt,0,1);
  if(trimDir)s.trim=C.clamp(s.trim+trimDir*1.25*D2R*dt,C.TRIM_MIN,C.TRIM_MAX);
  s.brake=!!window.brakeHeld();
}

window.SimBot={
  version:BOT_V,
  /** The radio's volume, 0 to 1 (0: silent), as the menu's slider: every voice on the radio, its hiss and clicks. Returns what it is now. */
  radioVolume(v){return v===undefined?opt.rvol:BOT_RVOL(v);},
  hello(){return{version:BOT_V,airportKey:AP.key,airports:C.AIRPORT_LIST.map(a=>Object.assign({},a)),aircraft:Object.keys(C.TYPES),modes:Object.keys(MODES),handling:['real','assist'],qualities:BOT_Q.slice(),cameras:BOT_CAM.slice(),weathers:Object.keys(G.WX),timeOfDay:botTod(),
    liveries:G.liveries.map(l=>({id:l.id,name:l.name,registration:'N427AS',locked:!livOK(l.id)})),
    release:JSON.parse(JSON.stringify(SIM_RELEASES[0])),changelog:JSON.parse(JSON.stringify(SIM_RELEASES)),
    airport:AP.id,callsign:{registration:'N427AS',full:C.FULL,abbreviated:C.ABBR},events:BOT_EV.filter(e=>e!=='*'),intents:BOT_INTENTS.slice()};},
  enable(){bot.on=true;document.body.classList.add('simbot');docEl.classList.add('simbot');return true;},
  disable(){bot.on=false;bot.c={pitch:0,roll:0,yaw:0,throttle:null,brakeL:0,brakeR:0,flaps:null};document.body.classList.remove('simbot');docEl.classList.remove('simbot');return true;},
  get enabled(){return bot.on;},
  unlockLivery(id){if(!G.liveries.some(l=>l.id===id))throw new Error('SimBot.unlockLivery: no livery called '+id);unlocked.add(id);return true;},
  state:botState,
  airport:botAirport,
  on(name,fn){if(!BOT_EV.includes(name)||typeof fn!=='function')throw new Error('SimBot.on: no event called '+name);
    (bot.ls[name]=bot.ls[name]||[]).push(fn);return()=>{const a=bot.ls[name],i=a.indexOf(fn);if(i>=0)a.splice(i,1);};},
  start(o){o=o||{};return new Promise((resolve,reject)=>{try{
    if(o.mode!=null&&!MODES[o.mode])throw new Error('SimBot.start: no mode called '+o.mode);
    if(o.aircraft!=null&&!C.TYPES[o.aircraft])throw new Error('SimBot.start: no aircraft called '+o.aircraft);
    if(o.handling!=null&&o.handling!=='real'&&o.handling!=='assist')throw new Error('SimBot.start: handling is real or assist');
    if(o.quality!=null&&!BOT_Q.includes(o.quality))throw new Error('SimBot.start: no quality called '+o.quality);
    if(o.view!=null&&!BOT_CAM.includes(o.view))throw new Error('SimBot.start: no view called '+o.view);
    if(o.weather!=null&&!Object.prototype.hasOwnProperty.call(G.WX,o.weather))throw new Error('SimBot.start: no weather called '+o.weather);
    if(o.time!=null){const r=botTod();if(typeof o.time!=='number'||!(o.time>=r.min&&o.time<=r.max))throw new Error('SimBot.start: time is hours from '+r.min+' to '+r.max);}
    if(o.sequencing!=null&&typeof o.sequencing!=='boolean')throw new Error('SimBot.start: sequencing is true or false');
    if(o.livery!=null){if(!G.liveries.some(l=>l.id===o.livery))throw new Error('SimBot.start: no livery called '+o.livery);if(!livOK(o.livery))throw new Error('SimBot.start: the livery '+o.livery+' is locked');}
    // the same choices the start card makes, saved the same way
    if(o.mode!=null){opt.mode=o.mode;store.set('ptm',opt.mode);}
    if(o.aircraft!=null){opt.ac=o.aircraft;store.set('pta',opt.ac);C.setAircraft(opt.ac);G.setAircraft(opt.ac);}
    if(o.livery!=null){opt.lv=G.setLivery(o.livery);store.set('ptlv',opt.lv);}
    if(o.handling!=null){opt.model=o.handling;store.set('pth',opt.model);}
    if(o.quality!=null)window.SimBot.setQuality(o.quality);
    if(o.weather!=null){opt.wx=o.weather;store.set('ptw',opt.wx);G.setWeather(opt.wx);}      // as the menu's WEATHER button
    if(o.time!=null){G.setTime(o.time);store.set('ptt2',String(o.time));}                  // as the menu's TIME OF DAY slider
    if(o.weather!=null||o.time!=null)syncGfx();                                             // and the menu shows it, as setQuality does

    bot.phase=null;bot.c={pitch:0,roll:0,yaw:0,throttle:null,brakeL:0,brakeR:0,flaps:null};   // a new flight starts hands-off: nothing held over from the last one
    launch({beginner:o.beginner!=null?!!o.beginner:opt.beg,freeze:opt.freeze,coach:o.coach!=null?!!o.coach:opt.coach,voice:o.voice!=null?!!o.voice:opt.voice,sound:o.sound!=null?!!o.sound:opt.sfx});
